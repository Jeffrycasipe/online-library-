<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      /* background-color: #0e3b6e; */
      background:linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url(../img/bookshelfs.jpg);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .container {
      color: black;
      background: linear-gradient(140deg, #3C3D37, #697565); 
      padding:10px;
      border-radius: 20px;
      width: 35%;
      height: auto;
      text-align: center;
      /* z-index: 1; */
      
    }
    .container h1,p{
      color: white;
    }
    .container a{
      color: rgb(11, 0, 160);
    }
    .container a:hover{
      color: rgb(201, 18, 18);
    }
    .container input[type="text"],.container input[type="password"],.container input[type="file"],.container input[type="number"],select{
        width:90%;
        height: 50px;
        margin-top: 10px;
        font-size: 15px;
        padding: 10px;
        border: 1px solid #ffffff;
        border-radius: 5px;
        background-color: rgba(255, 255, 255,1);
        
    }
    .container input[type="submit"]{
       
            color: rgb(0, 0, 0);
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 40%;
            margin:20px;
           
            
    }
    .container input[type="submit"]:hover{
      background-color: #40cc45;
      color: #ffffff;
    }
    .btn a, .btn input[type="submit"] {
        background-color: white;
        display: inline-block;
        width: 40%;
        font-size: 18px;
    }
    .btn a{
        text-decoration: none;
       
        color: rgb(0, 0, 0);
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 40%;
        margin:20px;
       
    }
    .btn a:hover{
        background-color: #d41010;
        color: #ffffff;
        
    }
  </style>
</head>
<body>
  
  <div class="container">
    <form method="POST" action="../php/addbook.php" enctype="multipart/form-data">
      <h1>Add Books</h1>
      
      
      <input type="file" name="image" id="image" required>

      <input type="text" name="bookname" id="bookname" placeholder="Book Name" required>
  
      <input type="text" name="description" id="description" placeholder="Description" required>
  
      <input type="number" name="pagenum" id="pagenum" placeholder="Number of Pages" required>
  
      <input type="text" name="genre" id="genre" placeholder="Genre" required>
  
      <input type="number" name="quantity" id="quantity" placeholder="Quantity" required>
  
      <div class="btn">
          <a href="../php/books.php">CANCEL</a>
          <input type="submit" value="SAVE">
      </div>  
  </form>
  
  </div>
  <script type="text/javascript" src="../jquery/jquery.js"></script>
    <script type="text/javascript" src="../js/addbook.js"></script>
</body>

</html>
