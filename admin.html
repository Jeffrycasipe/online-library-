<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-image: url(../style/PIC.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      color: #333;
      display: flex;
      min-height: 100vh;
    }

    header {
      background-color: #2c3e50;
      padding: 20px 5%;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      width: 100%;
      z-index: 1000;
    }

    header .logo {
      font-size: 1.8rem;
      font-weight: 600;
    }

   

    .sidebar {
      width: 250px;
      background-color: #34495e;
      color: #fff;
      position: fixed;
      top: 70px; /* Adjusted to account for header height */
      bottom: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .sidebar a:hover {
      color: #40cc45;
      background-color: #56728b;
    }
    .sidebar .navBook{
      color: red;
    }



    .main {
      margin-left: 240px; /* Adjusted for sidebar */
      padding: 20px;
      flex: 1;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-top: 70px; /* Adjusted for header */
    }

    .welcome {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #0680fa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .stat-card {
      background-color: #ecf0f1;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .stat-card h3 {
      margin-bottom: 10px;
      color: #2980b9;
    }

    .stat-card p {
      color: #7f8c8d;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Admin Dashboard</div>
    
  </header>

  <div class="sidebar">
    <h3>Navigation</h3>
      <a href="admin.html" class="navBook"><i class="fas fa-home"></i>Home</a>
      <a href="../php/books.php"><i class="fas fa-book"></i>Books</a>
      <a href="../index.html"><i class="fas fa-sign-out-alt"></i>Log Out</a>
  </div>

  <div class="main">
    <div class="welcome">Welcome, Admin!</div>

    <div class="stats">
      <div class="stat-card">
        <h3>Total Users</h3>
        <p>150</p>
      </div>
      <div class="stat-card">
        <h3>Books Available</h3>
        <p>320</p>
      </div>
      <div class="stat-card">
        <h3>Active Loans</h3>
        <p>75</p>
      </div>
    </div>
  </div>
</body>
</html>
