<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMT4x4c9d0jRH7N8B6I64f4e0N1kUs3Vo69kP8" crossorigin="anonymous">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(../style/sss.jpg) no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      
      padding: 30px;
      border-radius: 15px;
      width: 50%;
      max-height: 90vh;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      overflow-y: auto;
    }

    .container h1 {
      color: hsl(190, 33%, 96%);
      font-size: 2em;
      margin-bottom: 20px;
    }

    .container p {
      margin-top: 20px;
      font-size: 0.9em;
      color: #34495e;
    }

    .container a {
      color: #e67e22;
      
    }

    .container a:hover {
      color: #e74c3c;
    }

    .form-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .form-group > div {
      width: 48%;
    }

    .form-group label {
      font-size: 0.9em;
      color: hsl(214, 24%, 94%);
      font-weight: bold;
      margin-bottom: 10px;
      display: inline-block;
    }

    .form-group label i {
      margin-right: 10px;
      color: #3498db;
    }

    .form-group input[type="text"], 
    .form-group input[type="password"], 
    .form-group select {
      width: 100%;
      height: 40px;
      padding: 10px;
      font-size: 0.9em;
      border: 1px solid #bdc3c7;
      border-radius: 8px;
      margin-bottom: 15px;
      transition: border-color 0.3s ease;
    }

    .form-group input[type="text"]:focus,
    .form-group input[type="password"]:focus,
    .form-group select:focus {
      border-color: #3498db;
    }

    .container input[type="submit"] {
      background-color: hsl(201, 84%, 63%);
      color: white;
      border: none;
      border-radius: 8px;
      width: 50%;
      padding: 15px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
      margin-top: 20px;
    }

    .container input[type="submit"]:hover {
      background-color:  #387eb8;
      transform: translateY(-3px);
    }

    .container input[type="submit"]:active {
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .container {
        width: 90%;
      }

      .form-group {
        flex-direction: column;
      }

      .form-group > div {
        width: 100%;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <form onsubmit="frmSub(event)">
      <h1>Sign Up</h1>

      <div class="form-group">
        <div>
          <label for="Id"><i class="fas fa-id-card"></i> Student ID</label>
          <input type="text" id="Id" placeholder="Student ID" required>
          
          <label for="Fname"><i class="fas fa-user"></i> First Name</label>
          <input type="text" id="Fname" placeholder="First Name" required>
          
          <label for="Mname"><i class="fas fa-user"></i> Middle Name</label>
          <input type="text" id="Mname" placeholder="Middle Name" required>

          <label for="Lname"><i class="fas fa-user"></i> Last Name</label>
          <input type="text" id="Lname" placeholder="Last Name" required>
          
          <label for="Gender"><i class="fas fa-venus-mars"></i> Gender</label>
          <select id="Gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div>
          <label for="Course"><i class="fas fa-book"></i> Course</label>
          <select id="Course" required>
            <option value="BS Info. Tech.">BS Info. Tech.</option>
            <option value="BS Criminology">BS Criminology</option>
            <option value="BS Industrial Tech.">BS Industrial Tech.</option>
            <option value="BS Hotel Management">BS Hotel Management</option>
            <option value="BS Education">BS Education</option>
          </select>

          <label for="Year"><i class="fas fa-calendar-alt"></i> Year</label>
          <select id="Year" required>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>

          <label for="Section"><i class="fas fa-graduation-cap"></i> Section</label>
          <input type="text" id="Section" placeholder="Section" required>

          <label for="Email"><i class="fas fa-envelope"></i> Email</label>
          <input type="text" id="Email" placeholder="Email" required>

          <label for="Password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="Password" placeholder="Password" required>
        </div>
      </div>

      <input type="submit" value="Sign Up">
      <p>Already have an account? <i><a href="../php/home.php">Log In!</a></i></p>
    </form>
  </div>
  
  <script type="text/javascript" src="../jquery/jquery.js"></script>
  <script type="text/javascript" src="../js/js.js"></script>
</body>
</html>
